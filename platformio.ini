; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain 'run'/'upload' targets the main firmware only.
default_envs = esp32dev

[env:esp32dev]
; Pinned: firmware uses the legacy driver/mcpwm.h API (ESP-IDF v4.4.7 via
; Arduino-ESP32 2.0.17). Arduino-ESP32 3.x / IDF 5 deprecates that API, and the
; MCPWM clock/dead-time math in src/main.cpp is verified against v4.4.7 only.
platform = espressif32 @ 7.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 failed on this board's USB-serial link (no data after baud change).
upload_speed = 115200
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<*> -<opto13_test.cpp>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4

; Bench test: drives only GPIO13 (opto 1); GPIO14/GPIO26 held LOW.
; Upload: platformio run -e opto13_test -t upload
[env:opto13_test]
extends = env:esp32dev
build_src_filter = -<*> +<opto13_test.cpp>
lib_deps =
